[project]
name = "intelligent-claims-agent"
version = "0.2.0"
description = "Human-governed claims intake workflow using LangGraph."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "PyJWT[crypto]>=2.10,<3", "langgraph>=1.2.15,<2", "langgraph-checkpoint-sqlite>=3.1.2,<4", "cryptography>=44"]
[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
